<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="128x128" />
		<title>sp.insulina</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0a0a" />
		<script>
			try {
				const saved = localStorage.getItem('theme');
				const theme =
					saved ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
				document.documentElement.dataset.theme = theme;
				document
					.querySelector('meta[name="theme-color"]')
					?.setAttribute('content', theme === 'light' ? '#f2f2f7' : '#0a0a0a');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body class="bg-canvas text-ink" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
